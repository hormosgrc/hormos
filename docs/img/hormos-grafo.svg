<text x="42" y="461" text-anchor="start" font-size="10" font-weight="800" fill="#7C3AED" letter-spacing=".08em">ANALISTA IA</text>
<text x="158" y="461" text-anchor="start" font-size="10" font-weight="400" fill="#64748B" letter-spacing="0">roda na sua máquina — nenhum dado do SGSI sai da rede, inclusive o que a IA processa</text>
<text x="42" y="483" text-anchor="start" font-size="10.5" font-weight="400" fill="#0F172A" letter-spacing="0">Lê política e evidência · correlaciona com o controle · redige o parecer · diz o que já dá para declarar — e nunca inventa fato: tudo sai do que está registrado.</text>
<text x="42" y="528" text-anchor="start" font-size="10" font-weight="400" fill="#64748B" letter-spacing="0">ὅρμος — o ancoradouro abrigado no meio da viagem, e o colar: contas presas num mesmo fio.</text>
