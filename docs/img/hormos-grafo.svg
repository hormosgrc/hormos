<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" width="1120" height="540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img" aria-label="A cadeia do SGSI no Hormos">
<title>Hormos — a cadeia do SGSI</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="sv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker><marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker></defs>
<rect width="1120" height="540" fill="#FFFFFF"/>
<rect x="22" y="20" width="1076" height="92" rx="12" fill="#2563EB08" stroke="#2563EB33"/>
<text x="42" y="44" text-anchor="start" font-size="10" font-weight="800" fill="#2563EB" letter-spacing=".08em">AS RÉGUAS</text>
<text x="144" y="44" text-anchor="start" font-size="10" font-weight="400" fill="#64748B" letter-spacing="0">cada framework lê a MESMA cadeia e a mede na sua própria natureza — nunca um número único somando coisas incomparáveis</text>
<rect x="42" y="58" width="140" height="40" rx="10" fill="#2563EB0A" stroke="#2563EB55" stroke-width="1.6"/>
<text x="112.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#2563EB">ISO 27001</text>
<text x="112.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">93 controles</text>
<rect x="192" y="58" width="140" height="40" rx="10" fill="#2563EB0A" stroke="#2563EB55" stroke-width="1.6"/>
<text x="262.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#2563EB">CIS v8</text>
<text x="262.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">153 salvaguardas</text>
<rect x="342" y="58" width="140" height="40" rx="10" fill="#2563EB0A" stroke="#2563EB55" stroke-width="1.6"/>
<text x="412.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#2563EB">NIST CSF</text>
<text x="412.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">107 subcategorias</text>
<rect x="492" y="58" width="140" height="40" rx="10" fill="#2563EB0A" stroke="#2563EB55" stroke-width="1.6"/>
<text x="562.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#2563EB">COBIT</text>
<text x="562.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">41 objetivos</text>
<rect x="642" y="58" width="140" height="40" rx="10" fill="#2563EB0A" stroke="#2563EB55" stroke-width="1.6"/>
<text x="712.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#2563EB">ISO 42001</text>
<text x="712.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">38 controles</text>
<rect x="792" y="58" width="140" height="40" rx="10" fill="#2563EB0A" stroke="#2563EB55" stroke-width="1.6"/>
<text x="862.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#2563EB">LGPD</text>
<text x="862.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">20 artigos</text>
<rect x="942" y="58" width="140" height="40" rx="10" fill="#0891B214" stroke="#0891B2" stroke-width="1.6"/>
<text x="1012.0" y="71.0" text-anchor="middle" dominant-baseline="middle" font-size="11.5" font-weight="700" fill="#0891B2">iGovTIC-JUD</text>
<text x="1012.0" y="87.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">238 subitens</text>
<rect x="22" y="160" width="1076" height="232" rx="12" fill="#F8FAFC" stroke="#CBD5E1"/>
<text x="42" y="184" text-anchor="start" font-size="10" font-weight="800" fill="#0F172A" letter-spacing=".08em">A CADEIA</text>
<text x="124" y="184" text-anchor="start" font-size="10" font-weight="400" fill="#64748B" letter-spacing="0">tudo preso ao mesmo ativo — por isso é um grafo, e não uma lista de telas</text>
<rect x="42" y="206" width="148" height="54" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
<text x="116.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="#0F172A">ATIVO</text>
<text x="116.0" y="242.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">e o contexto dele</text>
<rect x="206" y="206" width="148" height="54" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
<text x="280.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="#0F172A">RISCO</text>
<text x="280.0" y="242.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">medido no ativo</text>
<rect x="370" y="206" width="148" height="54" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
<text x="444.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="#0F172A">CONTROLE</text>
<text x="444.0" y="242.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">e POLÍTICA que o sustenta</text>
<rect x="534" y="206" width="148" height="54" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
<text x="608.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="#0F172A">EVENTO / NC</text>
<text x="608.0" y="242.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">o que falhou</text>
<rect x="698" y="206" width="148" height="54" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
<text x="772.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="#0F172A">PLANO DE AÇÃO</text>
<text x="772.0" y="242.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">o que vai ser feito</text>
<rect x="862" y="206" width="148" height="54" rx="10" fill="#05966912" stroke="#059669" stroke-width="1.6"/>
<text x="936.0" y="226.0" text-anchor="middle" dominant-baseline="middle" font-size="13.5" font-weight="700" fill="#059669">EVIDÊNCIA</text>
<text x="936.0" y="242.0" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748B">a prova</text>
<path d="M190 233.0 L200 233.0" stroke="#475569" stroke-width="1.6" marker-end="url(#s)" fill="none"/>
<path d="M354 233.0 L364 233.0" stroke="#475569" stroke-width="1.6" marker-end="url(#s)" fill="none"/>
<path d="M518 233.0 L528 233.0" stroke="#475569" stroke-width="1.6" marker-end="url(#s)" fill="none"/>
<path d="M682 233.0 L692 233.0" stroke="#475569" stroke-width="1.6" marker-end="url(#s)" fill="none"/>
<path d="M846 233.0 L856 233.0" stroke="#475569" stroke-width="1.6" marker-end="url(#s)" fill="none"/>
<text x="198.0" y="198" text-anchor="middle" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0">expõe</text>
<text x="362.0" y="198" text-anchor="middle" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0">trata</text>
<text x="526.0" y="198" text-anchor="middle" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0">falha</text>
<text x="690.0" y="198" text-anchor="middle" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0">gera</text>
<text x="854.0" y="198" text-anchor="middle" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0">produz</text>
<rect x="512" y="288" width="192" height="40" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
<text x="608.0" y="308.0" text-anchor="middle" dominant-baseline="middle" font-size="10.5" font-weight="600" fill="#64748B">auditoria · verificação · monitoramento</text>
<path d="M608.0 288 L608.0 266" stroke="#475569" stroke-width="1.6" marker-end="url(#s)" fill="none"/>
<text x="738" y="312" text-anchor="start" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0">é assim que a falha aparece</text>
<path d="M936.0 260 L936.0 352 L444.0 352 L444.0 266" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#sv)"/>
<text x="690.0" y="368" text-anchor="middle" font-size="10" font-weight="700" fill="#059669" letter-spacing="0">a evidência prova que o plano deu certo — e valida que o controle e a política funcionam</text>
<path d="M936.0 206 C 936.0 150, 560.0 150, 560.0 116" stroke="#059669" stroke-width="2.4" fill="none" marker-end="url(#sv)"/>
<text x="400" y="142" text-anchor="middle" font-size="10.5" font-weight="800" fill="#059669" letter-spacing="0">a MESMA evidência comprova para TODAS as réguas — você anexa uma vez</text>
<path d="M560.0 392 L560.0 406" stroke="#7C3AED" stroke-width="1.4" fill="none" stroke-dasharray="4 3"/>
<rect x="22" y="408" width="1076" height="62" rx="12" fill="#7C3AED0C" stroke="#7C3AED44"/>
<text x="42" y="433" text-anchor="start" font-size="10" font-weight="800" fill="#7C3AED" letter-spacing=".08em">ANALISTA IA</text>
<text x="160" y="433" text-anchor="start" font-size="10" font-weight="400" fill="#64748B" letter-spacing="0">roda na sua máquina — nenhum dado do SGSI sai da rede, inclusive o que a IA processa</text>
<text x="42" y="455" text-anchor="start" font-size="10.5" font-weight="400" fill="#0F172A" letter-spacing="0">Lê a política e a evidência · correlaciona com o controle · redige o parecer · diz o que já dá para declarar — e nunca inventa fato: tudo sai do que está registrado.</text>
<text x="42" y="500" text-anchor="start" font-size="10" font-weight="400" fill="#64748B" letter-spacing="0">ὅρμος — o ancoradouro abrigado no meio da viagem, e o colar: contas presas num mesmo fio.</text>
<text x="1078" y="500" text-anchor="end" font-size="10" font-weight="600" fill="#64748B" letter-spacing="0">hormosgrc.github.io</text>
</svg>